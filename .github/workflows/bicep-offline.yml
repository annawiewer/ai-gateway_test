name: Bicep sample checks

on:
  pull_request:
    paths:
      - 'samples/bicep/**'
      - '.github/workflows/bicep-offline.yml'
  push:
    paths:
      - 'samples/bicep/**'
      - '.github/workflows/bicep-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: samples/bicep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: samples/bicep/uv.lock
      - name: Install Bicep compiler
        run: az bicep install
      - name: Run credential-free infrastructure checks
        run: |
          bash tests/test-apim-lifecycle.sh
          bash tests/test-ai-gateway-model-registration.sh
      - name: Run Python unit tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Build sample container
        run: docker build --tag bicep-foundry-agent:ci .
      - name: Run credential-free container smoke test
        run: python tests/container_smoke.py --image bicep-foundry-agent:ci
