name: Synchronize upstream originals

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      ARM_SKIP_PROVIDER_REGISTRATION: 'true'
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Test synchronization safeguards
        run: python -B -m unittest discover -s samples/terraform/tests -p test_upstream_sync.py
      - name: Prepare isolated candidates
        id: prepare
        run: python -B samples/terraform/scripts/sync-upstream.py prepare --workspace "$RUNNER_TEMP/upstream-sync"
      - name: Check both Terraform variants and upstream CLI
        if: steps.prepare.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python -B samples/terraform/scripts/sync-upstream.py validate --workspace "$RUNNER_TEMP/upstream-sync"
      - name: Publish checked fast-forwards atomically
        if: steps.prepare.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B samples/terraform/scripts/sync-upstream.py publish --workspace "$RUNNER_TEMP/upstream-sync"
      - name: Remove disposable worktrees
        if: always()
        run: python -B samples/terraform/scripts/sync-upstream.py cleanup --workspace "$RUNNER_TEMP/upstream-sync"
